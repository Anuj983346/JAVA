spring.application.name=vehicle-service
server.port= 9099

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50

resilience4j.retry.instances.orderService.max-attempts=3
resilience4j.retry.instances.orderService.wait-duration=2s

resilience4j.ratelimiter.instances.orderService.limit-for-period=5
resilience4j.ratelimiter.instances.orderService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.orderService.timeout-duration=0